name: PeruPOS

on:
  push:
    paths: ['perupos/**', '.github/workflows/perupos.yml']
  pull_request:
    paths: ['perupos/**', '.github/workflows/perupos.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: perupos

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perupos
          POSTGRES_PASSWORD: perupos
          POSTGRES_DB: perupos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U perupos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: perupos/package-lock.json

      # Instala todo y compila @perupos/shared (postinstall).
      - run: npm ci

      - name: Tipos (shared, backend y app)
        run: npm run typecheck

      - name: Tests (reglas compartidas + API contra PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://perupos:perupos@localhost:5432/perupos_test
